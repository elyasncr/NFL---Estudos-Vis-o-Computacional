[project]
name = "nfl-vision"
version = "0.1.0"
description = "Identificação de jogadores da NFL em fotos"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pillow>=10.4",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scikit-image>=0.24",
  "polars>=1.0",
  "nflreadpy>=0.1",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "torch>=2.7",
  "torchvision>=0.22",
  "ultralytics>=8.3",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
eval = ["roboflow>=1.1", "rfdetr>=1.2", "inference-sdk>=0.50"]

[project.scripts]
nfl-vision = "nfl_vision.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nfl_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: testes que carregam modelos reais (lentos, precisam de GPU/rede)"]
addopts = "-m 'not model'"
